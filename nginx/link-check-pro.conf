# ─────────────────────────────────────────────────────────────────────────────
# nginx site config — link-check-pro.top
#
# TLS termination is handled by Cloudflare (orange-cloud proxy mode).
# Cloudflare → origin uses plain HTTP. Origin nginx therefore listens only
# on :80 — no SSL certs, no http→https redirect (the redirect would create
# an infinite loop with Cloudflare's "Flexible SSL" mode).
#
# In Cloudflare dashboard set SSL/TLS mode to **Flexible** (current temporary
# state). Once you can switch to Full (strict) and put real LE certs on the
# origin, we re-enable the 443 server blocks.
#
# Drop into /etc/nginx/sites-available/link-check-pro.conf and symlink:
#   sudo ln -sf /etc/nginx/sites-available/link-check-pro.conf \
#               /etc/nginx/sites-enabled/link-check-pro.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   - docker-compose.prod.yml binds web → 127.0.0.1:4252 and api → 127.0.0.1:4253
# ─────────────────────────────────────────────────────────────────────────────

# Non-standard ports — match docker-compose.prod.yml loopback bindings.
upstream lc_web {
    server 127.0.0.1:4252;
    keepalive 32;
}

upstream lc_api {
    server 127.0.0.1:4253;
    keepalive 64;
}

# ═════════════════════════════════════════════════════════════════════════════
# 1. WEB — link-check-pro.top
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name link-check-pro.top;

    # Trust Cloudflare's X-Forwarded-Proto so the upstream sees the original
    # https scheme (Next.js / our app uses this for absolute URLs and cookies).
    # If $http_x_forwarded_proto is set by CF we use it; else default to http.
    set $forwarded_scheme $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_scheme $http_x_forwarded_proto;
    }

    # Hardening (CF terminates TLS so HSTS comes from CF; we still set the
    # rest defensively).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 5m;

    access_log /var/log/nginx/lc-web.access.log;
    error_log  /var/log/nginx/lc-web.error.log warn;

    # Hashed Next.js assets — cache aggressively (filename includes content hash)
    location ~ ^/_next/static/ {
        proxy_pass http://lc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Connection "";
        # 1 year, immutable — these URLs change with every deploy
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Everything else (HTML, RSC payloads) — must NOT be cached aggressively,
    # otherwise Cloudflare keeps serving stale HTML that references dead asset
    # hashes after a deploy. Cloudflare respects these headers when "Caching
    # Level" is set to "Standard" (the default).
    location / {
        proxy_pass http://lc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # Tell upstream caches (Cloudflare) and browsers not to keep HTML.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ═════════════════════════════════════════════════════════════════════════════
# 2. API — api.link-check-pro.top
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name api.link-check-pro.top;

    set $forwarded_scheme $scheme;
    if ($http_x_forwarded_proto) {
        set $forwarded_scheme $http_x_forwarded_proto;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    client_max_body_size 5m;

    access_log /var/log/nginx/lc-api.access.log;
    error_log  /var/log/nginx/lc-api.error.log warn;

    # ─── SSE endpoint: /api/v1/projects/{id}/stream ─────────────────────────
    location ~ ^/api/v1/projects/[^/]+/stream$ {
        proxy_pass http://lc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Connection "";

        # ── CRITICAL FOR SSE ──
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        tcp_nodelay on;
        chunked_transfer_encoding off;

        # ⚠️ Note: Cloudflare's free/Pro plan has a ~100s response timeout.
        # SSE will be cut by CF every 100s — the browser EventSource auto-
        # reconnects, so progress bars still work, just with brief blips.
        # Long-term fix: set api.link-check-pro.top DNS to "DNS only"
        # (grey cloud) so SSE bypasses CF entirely.
    }

    # ─── Everything else ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://lc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
