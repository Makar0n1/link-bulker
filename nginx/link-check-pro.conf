# ─────────────────────────────────────────────────────────────────────────────
# nginx site config — link-check-pro.top
#
# Drop this file into /etc/nginx/sites-available/link-check-pro.conf on the
# server, then symlink:
#   sudo ln -s /etc/nginx/sites-available/link-check-pro.conf \
#              /etc/nginx/sites-enabled/link-check-pro.conf
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Prerequisites:
#   1. certbot already issued certificates for both hostnames:
#        sudo certbot certonly --nginx -d link-check-pro.top -d www.link-check-pro.top
#        sudo certbot certonly --nginx -d api.link-check-pro.top
#      Adjust paths below if your certs live elsewhere.
#   2. docker-compose.prod.yml has web bound to 127.0.0.1:3000 and api to
#      127.0.0.1:3001. The compose file in this repo already does this.
#
# Why two upstream blocks: it's idiomatic, lets us tweak per-upstream settings
# (timeouts, keepalive) without touching the location.
# ─────────────────────────────────────────────────────────────────────────────

# Non-standard ports — picked to avoid clashes with other projects on the host.
# Must match the loopback bindings in docker-compose.prod.yml.
upstream lc_web {
    server 127.0.0.1:4252;
    keepalive 32;
}

upstream lc_api {
    server 127.0.0.1:4253;
    keepalive 64;
}

# Map for SSE detection — applied below to the API server block.
# When the request path matches /api/v1/projects/<id>/stream we switch to
# the no-buffer / long-timeout regime.
map $request_uri $is_sse {
    default 0;
    "~^/api/v1/projects/[^/]+/stream" 1;
}

# ═════════════════════════════════════════════════════════════════════════════
# 1. WEB — link-check-pro.top
# ═════════════════════════════════════════════════════════════════════════════

# HTTP → HTTPS redirect (apex + www)
server {
    listen 80;
    listen [::]:80;
    server_name link-check-pro.top www.link-check-pro.top;

    # Let certbot's webroot challenge keep working if you renew via webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://link-check-pro.top$request_uri;
    }
}

# Redirect www → apex (HTTPS)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.link-check-pro.top;

    ssl_certificate     /etc/letsencrypt/live/link-check-pro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link-check-pro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://link-check-pro.top$request_uri;
}

# Main web server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name link-check-pro.top;

    ssl_certificate     /etc/letsencrypt/live/link-check-pro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/link-check-pro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Hardening
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml+rss image/svg+xml;
    gzip_min_length 1024;

    # Body size — Next.js usually doesn't take big uploads, but Manual import
    # CSV can be a few hundred KB. Bump to 5MB to be safe.
    client_max_body_size 5m;

    # Logs
    access_log /var/log/nginx/lc-web.access.log;
    error_log  /var/log/nginx/lc-web.error.log warn;

    location / {
        proxy_pass http://lc_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Keepalive to upstream
        proxy_set_header Connection "";

        # Reasonable timeouts for normal Next.js traffic
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ═════════════════════════════════════════════════════════════════════════════
# 2. API — api.link-check-pro.top
# ═════════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;
    server_name api.link-check-pro.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://api.link-check-pro.top$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.link-check-pro.top;

    ssl_certificate     /etc/letsencrypt/live/api.link-check-pro.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.link-check-pro.top/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_types application/json text/plain;
    gzip_min_length 512;

    # API accepts JSON bodies up to ~1MB (1000-link manual batch + occurrences).
    # Be generous to leave headroom.
    client_max_body_size 5m;

    access_log /var/log/nginx/lc-api.access.log;
    error_log  /var/log/nginx/lc-api.error.log warn;

    # ─── SSE endpoint: /api/v1/projects/{id}/stream ─────────────────────────
    # Matches via regex (named location is cleaner for the SSE-specific knobs).
    location ~ ^/api/v1/projects/[^/]+/stream$ {
        proxy_pass http://lc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # ── CRITICAL FOR SSE ──
        # 1) No buffering — flush bytes immediately to the client
        proxy_buffering off;
        proxy_cache off;
        # 2) Defeat any intermediate buffering hints
        proxy_set_header X-Accel-Buffering no;
        add_header X-Accel-Buffering no;
        # 3) Long read timeout — we want the connection to stay open for hours
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        # 4) Keep TCP alive
        tcp_nodelay on;
        chunked_transfer_encoding off;
    }

    # ─── Everything else (regular JSON API) ─────────────────────────────────
    location / {
        proxy_pass http://lc_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
