name: Build & Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (defaults to commit SHA)"
        required: false
        type: string

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # 1. Build & push 3 images in parallel
  # ───────────────────────────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - target: api
            dockerfile: Dockerfile.api
            image: link-checker-api
          - target: worker
            dockerfile: Dockerfile.worker
            image: link-checker-worker
          - target: web
            dockerfile: Dockerfile.web
            image: link-checker-web

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$SHA_SHORT"; fi
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}"
          # Lowercase namespace (GHCR requires it)
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "tags=$IMAGE:$TAG,$IMAGE:latest" >> $GITHUB_OUTPUT

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,scope=${{ matrix.target }},mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.link-check-pro.top

  # ───────────────────────────────────────────────────────────────────────────
  # 2. Deploy to VPS via SSH
  # ───────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://link-check-pro.top

    steps:
      - uses: actions/checkout@v4

      - name: Compute tag
        id: tag
        run: |
          SHA_SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="$SHA_SHORT"; fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Copy compose + nginx + scripts to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.prod.yml,nginx/link-check-pro.conf,scripts/deploy.sh,scripts/backup-db.sh,scripts/smoke-prod.sh"
          target: "/opt/link-checker"
          overwrite: true

      - name: Run deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG
          script: |
            set -euo pipefail
            cd /opt/link-checker
            chmod +x scripts/*.sh

            # Login to GHCR (token has read:packages scope)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Pin tag for this deploy by exporting into the env file Compose reads
            # We update IMAGE_TAG line in .env in-place (creates it if missing).
            if grep -q '^IMAGE_TAG=' .env; then
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_TAG}|" .env
            else
              echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            fi

            ./scripts/deploy.sh
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}

      - name: Smoke test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/link-checker
            ./scripts/smoke-prod.sh
